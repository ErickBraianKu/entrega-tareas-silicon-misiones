<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Character Counter</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="contador">
    <section class="panel">
      <div class="encabezado">
        <p class="etiqueta">JavaScript Core</p>
        <h1>Contador de caracteres</h1>
        <p class="descripcion">Escribí o pegá un texto para ver las métricas actualizadas en vivo.</p>
      </div>

      <label for="texto">Texto</label>
      <textarea id="texto" rows="8" maxlength="5000" placeholder="Escribí tu mensaje..."></textarea>

      <div class="limite">
        <div class="barra" aria-hidden="true">
          <span id="progreso"></span>
        </div>
        <p id="aviso" class="aviso">Límite sugerido: 280 caracteres.</p>
      </div>

      <div class="resultados" aria-live="polite">
        <article class="tarjeta">
          <span id="caracteres">0</span>
          <p>Caracteres</p>
        </article>
        <article class="tarjeta">
          <span id="palabras">0</span>
          <p>Palabras</p>
        </article>
        <article class="tarjeta">
          <span id="sinEspacios">0</span>
          <p>Sin espacios</p>
        </article>
        <article class="tarjeta tarjeta-restantes">
          <span id="restantes">280</span>
          <p>Restan</p>
        </article>
      </div>

      <button id="limpiar" type="button">Limpiar</button>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
