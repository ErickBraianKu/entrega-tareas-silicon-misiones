<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lista de Tareas — TP Clase 13 (DOM)</title>
  <style>
    /* ===== Estilos base (ya hechos, no hace falta que los toques) ===== */
    * { box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #F1F2F2;
      color: #20203A;
      display: flex;
      justify-content: center;
      padding: 40px 16px;
    }
    .app {
      background: #fff;
      width: 100%;
      max-width: 440px;
      border-radius: 14px;
      box-shadow: 0 10px 30px rgba(43, 41, 109, 0.12);
      padding: 26px;
    }
    h1 { color: #2B296D; font-size: 22px; margin: 0 0 4px; }
    .sub { color: #6E6E80; font-size: 13px; margin: 0 0 20px; }
    .fila { display: flex; gap: 8px; margin-bottom: 16px; }
    #nuevaTarea {
      flex: 1;
      padding: 11px 12px;
      border: 1.5px solid #CFD0DA;
      border-radius: 8px;
      font-size: 15px;
    }
    #nuevaTarea:focus { outline: none; border-color: #0E6689; }
    #agregar {
      background: #0E6689;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 0 18px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }
    #agregar:hover { background: #0b4f68; }
    #lista { list-style: none; padding: 0; margin: 0; }
    #lista li {
      background: #F7F7FA;
      border: 1px solid #E7E7EE;
      border-radius: 8px;
      padding: 11px 12px;
      margin-bottom: 8px;
      font-size: 15px;
      cursor: pointer;
    }
    /* Clase para tachar una tarea hecha. La activás desde el JS con classList */
    #lista li.hecha {
      text-decoration: line-through;
      color: #9A9AAB;
      background: #EFEFF3;
    }
    #lista li {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    #lista li button {
      background: #B3261E;
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 5px 8px;
      cursor: pointer;
      font-size: 12px;
    }
    #lista li button:hover { background: #8C1D18; }
    #contador { color: #2B296D; font-weight: 600; font-size: 14px; margin-top: 16px; }
  </style>
</head>
<body>
  <div class="app">
    <h1>Mi Lista de Tareas</h1>
    <p class="sub">TP Clase 13 · El DOM</p>

    <!-- input + botón para agregar -->
    <div class="fila">
      <input id="nuevaTarea" type="text" placeholder="Escribí una tarea..." />
      <button id="agregar">Agregar</button>
    </div>

    <!-- acá se van a ir agregando las tareas (las crea el JS) -->
    <ul id="lista"></ul>

    <!-- contador de tareas -->
    <p id="contador">Tareas: 0</p>
  </div>

  <script>
    

    // 1) seleccionar los elementos que vas a usar
    let input    = document.querySelector("#nuevaTarea");
    let boton     = document.querySelector("#agregar");
    let lista     = document.querySelector("#lista");
    let contador  = document.querySelector("#contador");

    console.log("DOM listo: elementos seleccionados correctamente", {
      input,
      boton,
      lista,
      contador
    });

    // 2) Una función que actualiza el texto del contador
        function actualizarContador() {
      // cuentan solamente las tareas que todavía no están hechas.
      let pendientes = lista.querySelectorAll("li:not(.hecha)").length;
      contador.textContent = "Tareas pendientes: " + pendientes;
      console.log("contador actualizado, tareas pendientes:", pendientes);
    }

    // 3) cuando se hace click en "Agregar", crear una tarea
    boton.addEventListener("click", function () {
      let texto = input.value;   // lo que escribió el usuario
      console.log("texto ingresado:", texto);

      // No agregar tareas vacías ni formadas solamente por espacios.
      texto = texto.trim();
      if (texto === "") {
        console.warn("tarea vacía.");
        input.focus();
        return;
      }

      // Crear la tarea, ponerle el texto y agregarla a la lista.
      let li = document.createElement("li");
      li.textContent = texto;
      lista.appendChild(li);
      console.log("Tarea agregada:", texto);

      // Marcar o desmarcar la tarea como hecha.
      li.addEventListener("click", function () {
        li.classList.toggle("hecha");
        
        actualizarContador();
      });

      //  botón para eliminar la tarea.
      let eliminar = document.createElement("button");
      eliminar.textContent = "Eliminar";
      eliminar.type = "button";
      eliminar.addEventListener("click", function (e) {
        e.stopPropagation();
        console.log("Tarea eliminada:", texto);
        li.remove();
        actualizarContador();
      });
      li.appendChild(eliminar);

      input.value = "";          // limpiar el input
      actualizarContador();      // refrescar el contador
    });

    // permitir agregar con la tecla Enter.
    input.addEventListener("keydown", function (e) {
      if (e.key === "Enter") {
       
        boton.click();
      }
    });

    // mostrar el estado inicial del contador.
    actualizarContador();
  </script>
</body>
</html>
